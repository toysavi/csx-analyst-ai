# Docker Compose configuration for CSX AI Analyst with MongoDB Persistence
services:
  mongodb:
    image: mongo:7.0
    container_name: csx-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  csx-analyst:
    image: ghcr.io/toysavi/csx-analyst-ai:latest
    container_name: csx-analyst-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MONGODB_URI=mongodb://mongodb:27017/csx_analyst
      - MONGODB_DB_NAME=csx_analyst
      - PORT=3000
      - NODE_ENV=production

volumes:
  mongodb_data:
